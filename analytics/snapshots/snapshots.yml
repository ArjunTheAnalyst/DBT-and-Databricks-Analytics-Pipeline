snapshots:
  - name: job_postings_snapshot
    relation: ref('staging_job_postings_current')
    description: 'A snapshot recording daily changes to job postings.'
    config:
      schema: snapshots
      strategy: check
      unique_key: job_id
      check_cols:
        - job_title
        - company_name
        - job_location
        - job_schedule_type
        - job_work_from_home
        - salary_min
        - salary_max
        - salary_period
        - salary_currency
        - has_health_insurance
        - has_dental_insurance
        - has_paid_time_off
        - has_no_degree_mentioned
      # Uses the actual scrape time as the historical timestamp, 
      # preventing backfills from being stamped with the current run date.
      updated_at: searched_at